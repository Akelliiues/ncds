<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">NCDs Portal and Smart Health Suite</title>
  <desc id="desc">อินโฟกราฟิก 6 เสาหลักของระบบ NCDs Portal</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="14" stdDeviation="16" flood-color="#90a4b8" flood-opacity=".28"/><feDropShadow dx="-10" dy="-10" stdDeviation="14" flood-color="#ffffff" flood-opacity=".92"/></filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5ccdc1" flood-opacity=".3"/></filter>
    <style>
      .thai { font-family: 'Leelawadee UI','Tahoma',sans-serif; fill:#123454; }
      .kicker { font-size:22px; font-weight:800; letter-spacing:2px; fill:#008f95; }
      .title { font-size:58px; font-weight:900; }
      .subtitle { font-size:26px; fill:#51697d; }
      .cardTitle { font-size:27px; font-weight:900; }
      .cardText { font-size:19px; fill:#51697d; }
      .mini { font-size:17px; font-weight:800; fill:#008f95; }
      .num { font-size:20px; font-weight:900; fill:#fff; }
      .centerTitle { font-size:35px; font-weight:900; fill:#123454; }
      .centerText { font-size:20px; fill:#51697d; }
    </style>
  </defs>
  <image href="ncd-master-pillars-bg.png" x="0" y="0" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" opacity=".42"/>
  <rect width="1920" height="1080" fill="#f4f8fb" opacity=".52"/>

  <text class="thai kicker" x="100" y="84">NCDs PORTAL • SMART HEALTH SUITE</text>
  <text class="thai title" x="100" y="150">จากหน้าบันไดบ้าน สู่ข้อมูลเพื่อการตัดสินใจ</text>
  <text class="thai subtitle" x="100" y="194">6 เสาหลักที่เชื่อมการคัดกรอง การติดตาม และการกำกับงานในระบบเดียว</text>

  <!-- central platform -->
  <g filter="url(#softShadow)">
    <circle cx="960" cy="570" r="175" fill="#edf5f8"/>
    <circle cx="960" cy="570" r="145" fill="#f9fdfe" stroke="#cce8eb" stroke-width="3"/>
  </g>
  <circle cx="960" cy="474" r="34" fill="#008f95" filter="url(#innerGlow)"/>
  <path d="M941 475h38M960 456v38" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <text class="thai centerTitle" x="960" y="550" text-anchor="middle">NCDs Portal</text>
  <text class="thai centerTitle" x="960" y="592" text-anchor="middle">Smart Health Suite</text>
  <text class="thai centerText" x="960" y="630" text-anchor="middle">Simple &amp; Easy</text>
  <text class="thai centerText" x="960" y="660" text-anchor="middle">งานในพื้นที่ • ข้อมูลที่ใช้ได้จริง</text>

  <!-- cards -->
  <g filter="url(#softShadow)"><rect x="100" y="275" width="470" height="190" rx="28" fill="#f9fdfe" opacity=".92"/></g>
  <circle cx="150" cy="326" r="27" fill="#e75b53"/><text class="thai num" x="150" y="333" text-anchor="middle">1</text>
  <text class="thai cardTitle" x="195" y="333">Red Alert &amp; การส่งต่อ</text>
  <text class="thai cardText" x="150" y="382">แจ้งเหตุเคสวิกฤตและติดตามการส่งต่อ</text>
  <text class="thai mini" x="150" y="423">เคสวิกฤต • พิกัด • ช่องทางประสานงาน</text>

  <g filter="url(#softShadow)"><rect x="1350" y="275" width="470" height="190" rx="28" fill="#f9fdfe" opacity=".92"/></g>
  <circle cx="1400" cy="326" r="27" fill="#27aa9b"/><text class="thai num" x="1400" y="333" text-anchor="middle">2</text>
  <text class="thai cardTitle" x="1445" y="333">ทำงานหน้างานที่ง่ายขึ้น</text>
  <text class="thai cardText" x="1400" y="382">งานรายบ้าน • QR Code • แบบคัดกรอง</text>
  <text class="thai mini" x="1400" y="423">อสม. เข้าถึงงานและบันทึกผลได้สะดวก</text>

  <g filter="url(#softShadow)"><rect x="100" y="610" width="470" height="190" rx="28" fill="#f9fdfe" opacity=".92"/></g>
  <circle cx="150" cy="661" r="27" fill="#e5a82d"/><text class="thai num" x="150" y="668" text-anchor="middle">3</text>
  <text class="thai cardTitle" x="195" y="668">คะแนน รางวัล และเกียรติยศ</text>
  <text class="thai cardText" x="150" y="717">กระดานคะแนน • แลกรางวัล • ตราเกียรติยศ</text>
  <text class="thai mini" x="150" y="758">เห็นผลงานและติดตามงานค้างได้ชัดเจน</text>

  <g filter="url(#softShadow)"><rect x="1350" y="610" width="470" height="190" rx="28" fill="#f9fdfe" opacity=".92"/></g>
  <circle cx="1400" cy="661" r="27" fill="#7b6bb3"/><text class="thai num" x="1400" y="668" text-anchor="middle">4</text>
  <text class="thai cardTitle" x="1445" y="668">ติดตามต่อเนื่องด้วย DPAC</text>
  <text class="thai cardText" x="1400" y="717">ติดตามรอบถัดไปและการปรับพฤติกรรม</text>
  <text class="thai mini" x="1400" y="758">ลดโอกาสที่งานและการติดตามจะหลุดไป</text>

  <g filter="url(#softShadow)"><rect x="390" y="835" width="470" height="160" rx="28" fill="#f9fdfe" opacity=".92"/></g>
  <circle cx="440" cy="885" r="27" fill="#167f95"/><text class="thai num" x="440" y="892" text-anchor="middle">5</text>
  <text class="thai cardTitle" x="485" y="892">แดชบอร์ดและแผนที่กลุ่มเสี่ยง</text>
  <text class="thai cardText" x="440" y="940">ดูความครอบคลุม ความเสี่ยง และพื้นที่รับผิดชอบ</text>

  <g filter="url(#softShadow)"><rect x="1060" y="835" width="470" height="160" rx="28" fill="#f9fdfe" opacity=".92"/></g>
  <circle cx="1110" cy="885" r="27" fill="#d06446"/><text class="thai num" x="1110" y="892" text-anchor="middle">6</text>
  <text class="thai cardTitle" x="1155" y="892">หลังบ้านและการเชื่อมข้อมูล</text>
  <text class="thai cardText" x="1110" y="940">จัดการเป้าหมาย • ปีงบประมาณ • ซิงค์ JHCIS • โหมดทดลอง</text>

  <text class="thai mini" x="100" y="1038">สำนักงานสาธารณสุขอำเภอตาลสุม  •  NCDs Portal</text>
  <text class="thai mini" x="1820" y="1038" text-anchor="end">คัดกรอง • ดูแล • ติดตาม</text>
</svg>
